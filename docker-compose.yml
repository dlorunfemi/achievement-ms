services:

  app:
    build:
      context: .
      target: runtime
    container_name: achievements-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # This container owns schema setup; the worker and scheduler wait for it.
      RUN_MIGRATIONS: "true"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8000}}
      # Shared so every container signs and encrypts alike. Left empty, each
      # generates its own on boot, which is fine for a single-host demo.
      APP_KEY: ${APP_KEY:-}
      # The built-in server is single-worker by default, so one slow request
      # blocks the next. ServeCommand reads this before spawning the child.
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bumpa_db}
      DB_USERNAME: ${DB_USERNAME:-bumpa}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      # Swap for paystack, flutterwave or monnify once credentials are set.
      PAYMENTS_GATEWAY: ${PAYMENTS_GATEWAY:-fake}
      CASHBACK_BADGE_REWARD_MINOR: ${CASHBACK_BADGE_REWARD_MINOR:-30000}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_SOURCE_ACCOUNT_NUMBER: ${MONNIFY_SOURCE_ACCOUNT_NUMBER:-}
    healthcheck:
      # Laravel's health endpoint, fetched with php so the image needs no curl.
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/up\") === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - achievements

  # Achievement unlocking and cashback payouts are queued, so the stack needs a
  # worker for the chain to complete end to end. It waits for the app container
  # to report healthy, which is only after migrations have run.
  queue:
    build:
      context: .
      target: runtime
    container_name: achievements-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=1"]
    environment:
      RUN_MIGRATIONS: "false"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8000}}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bumpa_db}
      DB_USERNAME: ${DB_USERNAME:-bumpa}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      PAYMENTS_GATEWAY: ${PAYMENTS_GATEWAY:-fake}
      CASHBACK_BADGE_REWARD_MINOR: ${CASHBACK_BADGE_REWARD_MINOR:-30000}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_SOURCE_ACCOUNT_NUMBER: ${MONNIFY_SOURCE_ACCOUNT_NUMBER:-}
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - achievements

  # cashbacks:reconcile is scheduled every five minutes. Without a scheduler a
  # transfer the provider accepted but never called back on would sit in
  # Processing forever, so the stack runs one.
  scheduler:
    build:
      context: .
      target: runtime
    container_name: achievements-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      RUN_MIGRATIONS: "false"
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8000}}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bumpa_db}
      DB_USERNAME: ${DB_USERNAME:-bumpa}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      PAYMENTS_GATEWAY: ${PAYMENTS_GATEWAY:-fake}
      CASHBACK_BADGE_REWARD_MINOR: ${CASHBACK_BADGE_REWARD_MINOR:-30000}
      CASHBACK_RECONCILE_AFTER_MINUTES: ${CASHBACK_RECONCILE_AFTER_MINUTES:-15}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_SOURCE_ACCOUNT_NUMBER: ${MONNIFY_SOURCE_ACCOUNT_NUMBER:-}
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - achievements

  postgres:
    image: postgres:17-alpine
    container_name: achievements-postgres
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bumpa_db}
      POSTGRES_USER: ${DB_USERNAME:-bumpa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bumpa} -d ${DB_DATABASE:-bumpa_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - achievements

networks:
  achievements:
    driver: bridge

volumes:
  pgsql-data:
