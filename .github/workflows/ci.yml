name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-analysis:
    name: pint & phpstan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Analyse types
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: pest
    runs-on: ubuntu-latest

    # The suite talks to a real PostgreSQL: there is no SQLite fallback, and the
    # unique indexes that make cashback exactly-once are part of what is under test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bumpa_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the suite
        run: php artisan test --compact --coverage --min=90

  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    needs: tests

    # Line coverage only proves a line ran. This proves the assertions would notice
    # if the line changed, which is the claim that matters for the domain rules.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bumpa_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      # Advisory: the score is printed on every push, but a dip does not block a
      # merge until the number has settled on CI hardware.
      - name: Mutate the domain
        continue-on-error: true
        run: php artisan test --mutate --covered-only --class="App\Domain" --min=80
